[workspace]
members = [
    "workspace/ks-core",
    "workspace/ks-cli",
    "workspace/ks-std",
    "workspace/ks-global",
    "workspace/ks-vm-new",
    "workspace/ks-test",
    "workspace/ks-programator"
]

resolver = "2"
default-members = ["workspace/ks-test"]

[workspace.dependencies]
core = { path = "workspace/ks-core" }
vm-new = { path = "workspace/ks-vm-new" }

[workspace.package]
version = "0.5.0"
authors = ["Kyryl Lebedenko"]
